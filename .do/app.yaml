# DigitalOcean App Platform — Urban City Backend
#
# 1. Замените YOUR_GITHUB_ORG/urban-city-backend на свой репозиторий.
# 2. Задайте JWT_SECRET и CORS_ORIGINS в панели DO (Settings → App-Level Environment Variables).
# 3. doctl apps create --spec .do/app.yaml
#    или: Apps → Create App → Upload spec / Connect GitHub.

name: urban-city-backend
region: fra

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

features:
  - buildpack-stack=ubuntu-22

services:
  - name: api
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: YOUR_GITHUB_ORG/urban-city-backend
      branch: main
      deploy_on_push: true
    instance_count: 1
    instance_size_slug: basic-xs
    http_port: 8080
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: ENV
        value: production
      - key: PORT
        value: "8080"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: USE_DB
        value: "1"
      - key: RUN_MIGRATIONS
        value: "1"
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: https://YOUR-FRONTEND-DOMAIN
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
    routes:
      - path: /

databases:
  - name: db
    engine: PG
    version: "16"
    production: false
    cluster_name: urban-city-db
