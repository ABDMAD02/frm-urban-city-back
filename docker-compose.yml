# Локальный prod-like стенд: API + PostgreSQL.
# Запуск: docker compose up --build
# API: http://localhost:8000/docs

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: urban
      POSTGRES_PASSWORD: urban
      POSTGRES_DB: urban_city
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urban -d urban_city"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8080"
    environment:
      ENV: production
      PORT: "8080"
      JWT_SECRET: local-dev-secret-at-least-32-characters-long
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      DATABASE_URL: postgresql+psycopg://urban:urban@db:5432/urban_city
      USE_DB: "1"
      RUN_MIGRATIONS: "1"
      SEED_DEMO: "0"
      BOOTSTRAP_PLATFORM: "1"
      R2_REQUIRED: "0"
      # R2_ENDPOINT_URL: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
      # R2_ACCESS_KEY_ID:
      # R2_SECRET_ACCESS_KEY:
      # R2_BUCKET: frm-urban-city
      # R2_PUBLIC_BASE_URL: https://pub-xxxx.r2.dev
      # If R2_PUBLIC_BASE_URL empty → GET /photos returns SigV4 presigned URLs
      # R2_PRESIGN_TTL_SECONDS: "3600"
      WEB_CONCURRENCY: "2"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
