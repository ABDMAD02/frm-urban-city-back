# Alembic-конфигурация Urban City.
# Строка подключения (sqlalchemy.url) НЕ задаётся здесь — берётся из окружения
# DATABASE_URL в alembic/env.py (см. db/base.get_database_url).

[alembic]
script_location = alembic
prepend_sys_path = .
# Формат имени новых ревизий: 0002_slug и т.д.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
